spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:19092  # non-existent port; no Kafka in IT tests

management:
  health:
    kafka:
      enabled: false
    redis:
      enabled: false
  # Disable OTel exporter in tests — no Jaeger running
  tracing:
    export:
      enabled: false
