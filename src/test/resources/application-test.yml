spring:
  main:
    banner-mode: off
  mvc:
    problemdetails:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:19092  # non-existent port; no Kafka in IT tests

management:
  health:
    kafka:
      enabled: false
    redis:
      enabled: false
  # Disable OTel exporter in tests — no Jaeger running
  tracing:
    export:
      enabled: false

logging:
  level:
    root: WARN
    com.lmoraesdev.payment: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.hibernate.orm.jdbc.extract: WARN
    org.hibernate: WARN
    org.testcontainers: WARN
    com.zaxxer.hikari: WARN
    org.springframework: WARN
